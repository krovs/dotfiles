- defaults:
    link:
      create: true
      relink: true
      force: true

- create:
    - ~/.config/kitty
    - ~/.config/foot
    - ~/.config/noctalia
    - ~/.config/fish/functions

- link:
    ~/.config/kitty: .config/kitty
    ~/.config/foot/foot.ini: .config/foot/foot.ini
    ~/.config/fish/conf.d: .config/fish/conf.d
    ~/.config/fish/fish_plugins: .config/fish/fish_plugins
    ~/.config/fish/functions/asp.fish: .config/fish/functions/asp.fish
    ~/.config/niri/custom.kdl: .config/niri/custom.kdl
    ~/.config/noctalia/config.toml: .config/noctalia/config.toml
    ~/.config/starship.toml: .config/starship.toml

- shell:
    - description: Apply pfetch greeting after the CachyOS Fish configuration
      command: grep -qFx 'source ~/.config/fish/conf.d/greeting.fish' ~/.config/fish/config.fish || printf '\nsource ~/.config/fish/conf.d/greeting.fish\n' >> ~/.config/fish/config.fish
    - description: Apply Starship after the CachyOS Fish configuration
      command: grep -qFx 'source ~/.config/fish/conf.d/starship.fish' ~/.config/fish/config.fish || printf '\nsource ~/.config/fish/conf.d/starship.fish\n' >> ~/.config/fish/config.fish
    - description: Add custom.kdl include to niri config
      command: grep -qF 'include "./custom.kdl"' ~/.config/niri/config.kdl 2>/dev/null || echo 'include "./custom.kdl"' >> ~/.config/niri/config.kdl
    - description: Validate Niri configuration
      command: niri validate
    - description: Validate Noctalia 5 configuration
      command: noctalia config validate
