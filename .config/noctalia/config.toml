[bar.default]
center = [ "workspaces", "spacer_2", "clock" ]
concave_edge_corners = false
end = [
    "cat",
    "media",
    "notifications",
    "tray",
    "clipboard",
    "group:g2",
    "volume",
    "brightness",
    "battery",
    "keyboard_layout",
    "control-center"
]
margin_edge = 4
margin_ends = 5
start = [ "launcher", "group:g1" ]

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "cpu", "ram", "temp" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "network", "status", "bluetooth" ]
    opacity = 1.0
    padding = 6.0

[calendar]
enabled = true

[dock]
concave_edge_corners = false
enabled = true
reserve_space = false
show_dots = true
smart_auto_hide = true

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1720.0
    cy = 1258.0
    output = "HDMI-A-1"
    placement_height = 1440.0
    placement_width = 3440.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
show_actions = false

[plugins]
enabled = [ "dotnetrob/cat", "davemhammer/tailscale", "noctalia/bongocat" ]

[shell]
avatar_path = "~/Downloads/avatars/ChatGPT Image Oct 2, 2026, 06_53_34 PM.png"
external_ip_enabled = true

    [shell.keyboard_layout.custom_labels]
    "English (US)" = "en"
    Spanish = "es"

    [shell.launcher]
    app_grid = true
    pinned = [
        "brave-browser",
        "com.microsoft.VSCode",
        "discord",
        "foot",
        "net.lutris.Lutris",
        "steam",
        "com.stremio.Stremio",
        "org.telegram.desktop",
        "com.spotify.Client",
        "md.obsidian.Obsidian",
        "org.localsend.localsend_app"
    ]

    [shell.panel]
    clipboard_position = "top_right"
    open_near_click_control_center = true

[theme]
builtin = "Catppuccin"

[wallpaper.default]
path = "~/Pictures/Wallpapers/alone.png"

[wallpaper.last]
path = "~/Pictures/Wallpapers/alone.png"

[wallpaper.monitors.HDMI-A-1]
path = "~/Pictures/Wallpapers/alone.png"

[widget.battery]
capsule = true
hide_when_plugged = true

[widget.brightness]
capsule = true
show_label = false

[widget.cat]
type = "dotnetrob/cat:cat"

[widget.clipboard]
capsule = true

[widget.clock]
capsule = true
format = "{:%H:%M %a %d %b}"

[widget.control-center]
capsule = true

[widget.keyboard_layout]
capsule = true

[widget.media]
capsule = true

[widget.network]
show_label = false

[widget.notifications]
capsule = true

[widget.spacer_2]
length = 10
type = "spacer"

[widget.status]
type = "davemhammer/tailscale:status"

[widget.tray]
capsule = true

[widget.volume]
capsule = true
show_label = false
