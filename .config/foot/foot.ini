# ~/.config/foot/foot.ini

[main]
term=xterm-256color

font=Hack Nerd Font:size=11
font-bold=Hack Nerd Font:style=Bold:size=11
font-italic=Hack Nerd Font:style=Italic:size=11
font-bold-italic=Hack Nerd Font:style=Bold Italic:size=11

pad=10x8
initial-window-size-chars=100x30
initial-color-theme=dark

[cursor]
style=beam
blink=yes
beam-thickness=1.5

[mouse]
hide-when-typing=yes

[scrollback]
lines=10000
multiplier=3.0

[colors-dark]

# Catppuccin Mocha
foreground=cdd6f4
background=1e1e2e

# Translucidez y desenfoque del fondo mediante el compositor Wayland.
alpha=0.80
blur=yes

# Cursor: texto / fondo del cursor
cursor=1e1e2e f5e0dc

# Selección
selection-foreground=1e1e2e
selection-background=f5e0dc

# URLs
urls=f5e0dc

# ANSI normal
regular0=45475a
regular1=f38ba8
regular2=a6e3a1
regular3=f9e2af
regular4=89b4fa
regular5=f5c2e7
regular6=94e2d5
regular7=bac2de

# ANSI bright
bright0=585b70
bright1=f38ba8
bright2=a6e3a1
bright3=f9e2af
bright4=89b4fa
bright5=f5c2e7
bright6=94e2d5
bright7=a6adc8

[csd]
preferred=none
